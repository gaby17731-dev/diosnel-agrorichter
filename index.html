<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Richter - Lambaré</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style>
</head>
<body class="bg-[#f6f8f3]">
<header class="bg-white shadow sticky top-0 z-20">
<div class="max-w-6xl mx-auto p-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-12 h-12 bg-green-700 rounded-xl flex items-center justify-center text-white font-black text-xl">AR</div>
<div><h1 class="font-black text-green-800 leading-none">AGRO RICHTER</h1><p class="text-[11px] opacity-60 font-bold">Lambaré - Paraguay</p></div>
</div>
<a href="ventas.html" class="bg-green-700 text-white px-5 py-2 rounded-full font-bold text-sm">Ventas</a>
</div>
<div class="bg-green-700 text-white text-center py-2 text-sm font-bold">✅ Web funcionando - Agro Richter Lambaré - Catálogo Oficial</div>
</header>

<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-2xl p-4 shadow flex gap-2 mb-4">
<input id="busc" oninput="filtrar()" placeholder="Buscar producto... Ej: glifosato, urea, semilla" class="flex-1 border border-slate-200 rounded-full px-4 py-3 text-sm outline-none">
<button class="bg-slate-900 text-white px-6 rounded-full font-bold text-sm">Buscar</button>
</div>

<div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
</div>

<a id="wsp" href="https://wa.me/595981000000?text=Hola%20Agro%20Richter" target="_blank" class="fixed bottom-4 right-4 bg-[#25D366] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl text-2xl">W</a>

<script>
const productos=[
{nom:"Glifosato 48% - 20L",cat:"Herbicida",precio:380000,img:"🌿"},
{nom:"Urea Granulada 50kg",cat:"Fertilizante",precio:420000,img:"🌾"},
{nom:"Semilla Maiz Dekalb 540",cat:"Semillas",precio:950000,img:"🌽"},
{nom:"Fungicida Opera 5L",cat:"Fungicida",precio:680000,img:"🧪"},
{nom:"Insecticida Belt 1L",cat:"Insecticida",precio:520000,img:"🐛"},
{nom:"Fertilizante 15-15-15 50kg",cat:"Fertilizante",precio:390000,img:"💪"},
{nom:"Semilla Soja Intacta 40kg",cat:"Semillas",precio:850000,img:"🌱"},
{nom:"Adherente Agral 1L",cat:"Coadyuvante",precio:85000,img:"💧"},
{nom:"Cal Agricola 40kg",cat:"Enmienda",precio:75000,img:"⚪"},
];
function render(lista){
document.getElementById('grid').innerHTML=lista.map(p=>`
<div class="bg-white rounded-[20px] p-4 shadow border border-slate-100 flex flex-col">
<div class="text-4xl mb-2">${p.img}</div>
<p class="text-[10px] font-black bg-green-100 text-green-700 inline-block px-2 py-1 rounded-full w-fit">${p.cat}</p>
<h3 class="font-bold mt-2 leading-tight">${p.nom}</h3>
<p class="font-black text-xl mt-2">Gs. ${p.precio.toLocaleString('es-PY')}</p>
<button onclick="pedir('${p.nom}')" class="mt-3 bg-slate-900 text-white rounded-full py-3 font-bold text-sm">Pedir por WhatsApp</button>
</div>`).join('');
}
function filtrar(){let q=document.getElementById('busc').value.toLowerCase();render(productos.filter(p=>p.nom.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));}
function pedir(nom){window.open(`https://wa.me/595981000000?text=Hola%20Agro%20Richter%20quiero%20${encodeURIComponent(nom)}`,'_blank');}
render(productos);
</script>
</body>
</html>
